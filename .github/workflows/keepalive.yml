name: Codex Keepalive

on:
  schedule:
    # keepalive-start: UTC 18:00 = Beijing 02:00 (edit with scripts/set-cron.sh "HH:MM")
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Codex API base URL (or a full /responses or /chat/completions endpoint)'
        required: false
        default: 'https://anyrouter.top/v1'
      model:
        description: 'Model name'
        required: false
        default: 'gpt-6-astra'
      api_style:
        description: 'auto | responses | chat'
        required: false
        default: 'auto'

# Least privilege: the job only reads the repo.
permissions:
  contents: read

# Prevent concurrent runs stacking up
concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6h max, the script self-terminates at ~5h58m
    env:
      # Secrets live in Settings -> Secrets and variables -> Actions.
      # GitHub never prompts for them, and they are never workflow inputs.
      CODEX_TOKENS: ${{ secrets.CODEX_TOKENS || secrets.ANYROUTER_TOKENS }}
      BASE_URL: ${{ github.event.inputs.base_url || 'https://anyrouter.top/v1' }}
      MODEL: ${{ github.event.inputs.model || 'gpt-6-astra' }}
      API_STYLE: ${{ github.event.inputs.api_style || 'auto' }}
      QQ_EMAIL: ${{ secrets.QQ_EMAIL }}
      QQ_SMTP_AUTH_CODE: ${{ secrets.QQ_SMTP_AUTH_CODE }}
      # Optional: override timing from Settings -> Variables (no YAML edit).
      MAX_DURATION_SEC: ${{ vars.MAX_DURATION_SEC }}
      SLEEP_BETWEEN_ROUNDS: ${{ vars.SLEEP_BETWEEN_ROUNDS }}
      SLEEP_BETWEEN_TOKENS: ${{ vars.SLEEP_BETWEEN_TOKENS }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify tooling
        run: |
          jq --version
          curl --version | head -n 1

      - name: Check configuration
        run: bash scripts/preflight.sh

      - name: Run keepalive for all keys
        run: bash scripts/run-all.sh
