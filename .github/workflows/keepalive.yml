name: Codex Keepalive

on:
  schedule:
    # UTC 18:00 = UTC+8 02:00 daily
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Codex API base URL (or a full /responses or /chat/completions endpoint)'
        required: false
        default: 'https://anyrouter.top/v1'
      model:
        description: 'Model name'
        required: false
        default: 'gpt-6-astra'
      api_style:
        description: 'auto | responses | chat'
        required: false
        default: 'auto'

# Least privilege: the job only reads the repo.
permissions:
  contents: read

# Prevent concurrent runs stacking up
concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6h max, the script self-terminates at ~5h58m
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify tooling
        run: |
          jq --version
          curl --version | head -n 1

      - name: Run keepalive for all keys
        env:
          CODEX_TOKENS: ${{ secrets.CODEX_TOKENS || secrets.ANYROUTER_TOKENS }}
          BASE_URL: ${{ github.event.inputs.base_url || 'https://anyrouter.top/v1' }}
          MODEL: ${{ github.event.inputs.model || 'gpt-6-astra' }}
          API_STYLE: ${{ github.event.inputs.api_style || 'auto' }}
          QQ_EMAIL: ${{ secrets.QQ_EMAIL }}
          QQ_SMTP_AUTH_CODE: ${{ secrets.QQ_SMTP_AUTH_CODE }}
        run: bash scripts/run-all.sh
