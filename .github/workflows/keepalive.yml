name: Codex Keepalive

on:
  schedule:
    # keepalive-start: UTC 18:00 = Beijing 02:00 (edit with scripts/set-cron.sh "HH:MM")
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Codex API base URL (or a full /responses or /chat/completions endpoint)'
        required: false
        default: 'https://anyrouter.top/v1'
      model:
        description: 'Model name'
        required: false
        default: 'gpt-6-astra'
      api_style:
        description: 'auto | responses | chat'
        required: false
        default: 'auto'

# Least privilege: the job only reads the repo.
permissions:
  contents: read

# Prevent concurrent runs stacking up
concurrency:
  group: keepalive
  cancel-in-progress: false

# Why two jobs: GitHub caps a single job at 6 hours (360 minutes), so an
# 8-hour window is built from a ~6h job followed by a ~2h job. The success
# email is sent the moment the first key succeeds, so a normal day produces
# exactly one notification. Set the repository variable KEEPALIVE_EXTEND=false
# to keep only the first segment.
jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # hard GitHub limit; the script stops at ~5h58m
    env:
      # Secrets live in Settings -> Secrets and variables -> Actions.
      # GitHub never prompts for them, and they are never workflow inputs.
      CODEX_TOKENS: ${{ secrets.CODEX_TOKENS || secrets.ANYROUTER_TOKENS }}
      BASE_URL: ${{ github.event.inputs.base_url || 'https://anyrouter.top/v1' }}
      MODEL: ${{ github.event.inputs.model || 'gpt-6-astra' }}
      API_STYLE: ${{ github.event.inputs.api_style || 'auto' }}
      QQ_EMAIL: ${{ secrets.QQ_EMAIL }}
      QQ_SMTP_AUTH_CODE: ${{ secrets.QQ_SMTP_AUTH_CODE }}
      # Optional: override timing from Settings -> Variables (no YAML edit).
      MAX_DURATION_SEC: ${{ vars.MAX_DURATION_SEC }}
      SLEEP_BETWEEN_ROUNDS: ${{ vars.SLEEP_BETWEEN_ROUNDS }}
      SLEEP_BETWEEN_TOKENS: ${{ vars.SLEEP_BETWEEN_TOKENS }}
      # Hand-off file so the second segment does not notify a second time.
      # Relative to the workspace: the `runner` context is not allowed in
      # a job-level env block.
      REPORT_FILE: .keepalive-report.txt
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify tooling
        run: |
          jq --version
          curl --version | head -n 1

      - name: Check configuration
        run: bash scripts/preflight.sh

      - name: Run keepalive for all keys (part 1/2)
        run: bash scripts/run-all.sh

      - name: Upload partial report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: keepalive-part1
          path: .keepalive-report.txt
          if-no-files-found: ignore
          retention-days: 1

  keepalive-continue:
    needs: keepalive
    # Runs when part 1 failed (a bad key must not cut the window short), but NOT
    # when the whole run was cancelled. `always()` here would resurrect the
    # second segment after a cancel, which is why cancelling used to look like
    # it did nothing. Set KEEPALIVE_EXTEND=false to disable this segment.
    if: ${{ !cancelled() && vars.KEEPALIVE_EXTEND != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150  # 2h30m, the script stops at ~2h
    env:
      CODEX_TOKENS: ${{ secrets.CODEX_TOKENS || secrets.ANYROUTER_TOKENS }}
      BASE_URL: ${{ github.event.inputs.base_url || 'https://anyrouter.top/v1' }}
      MODEL: ${{ github.event.inputs.model || 'gpt-6-astra' }}
      API_STYLE: ${{ github.event.inputs.api_style || 'auto' }}
      QQ_EMAIL: ${{ secrets.QQ_EMAIL }}
      QQ_SMTP_AUTH_CODE: ${{ secrets.QQ_SMTP_AUTH_CODE }}
      SLEEP_BETWEEN_ROUNDS: ${{ vars.SLEEP_BETWEEN_ROUNDS }}
      SLEEP_BETWEEN_TOKENS: ${{ vars.SLEEP_BETWEEN_TOKENS }}
      # Notifies only when segment 1 never had a success (deduped via REPORT_FILE).
      REPORT_FILE: .keepalive-report.txt
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify tooling
        run: |
          jq --version
          curl --version | head -n 1

      - name: Download part 1 report
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: keepalive-part1
          path: .

      - name: Check configuration
        run: bash scripts/preflight.sh

      - name: Run keepalive for all keys (part 2/2)
        env:
          # Fixed 2h budget for this segment (step env overrides job env).
          MAX_DURATION_SEC: "7200"
        run: bash scripts/run-all.sh
