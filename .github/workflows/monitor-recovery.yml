name: Codex Recovery Monitor

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Codex API base URL (or a full /responses or /chat/completions endpoint)'
        required: false
        default: 'https://anyrouter.top/v1'
      model:
        description: 'Model name'
        required: false
        default: 'gpt-6-astra'
      api_style:
        description: 'auto | responses | chat'
        required: false
        default: 'auto'
      poll_interval:
        description: 'Seconds between rounds (default 1800)'
        required: false
        default: '1800'

permissions:
  contents: read

# Prevent concurrent runs stacking up
concurrency:
  group: monitor-recovery
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6h max
    env:
      CODEX_TOKENS: ${{ secrets.CODEX_TOKENS || secrets.ANYROUTER_TOKENS }}
      BASE_URL: ${{ github.event.inputs.base_url || 'https://anyrouter.top/v1' }}
      MODEL: ${{ github.event.inputs.model || 'gpt-6-astra' }}
      API_STYLE: ${{ github.event.inputs.api_style || 'auto' }}
      POLL_INTERVAL: ${{ github.event.inputs.poll_interval || vars.POLL_INTERVAL }}
      MAX_DURATION_SEC: ${{ vars.MAX_DURATION_SEC }}
      QQ_EMAIL: ${{ secrets.QQ_EMAIL }}
      QQ_SMTP_AUTH_CODE: ${{ secrets.QQ_SMTP_AUTH_CODE }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify tooling
        run: |
          jq --version
          curl --version | head -n 1

      - name: Check configuration
        run: bash scripts/preflight.sh

      - name: Monitor keys for recovery
        run: bash scripts/monitor-recovery.sh
