name: Codex Keepalive (Once)

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Codex API base URL (or a full /responses or /chat/completions endpoint)'
        required: false
        default: 'https://anyrouter.top/v1'
      model:
        description: 'Model name'
        required: false
        default: 'gpt-6-astra'
      api_style:
        description: 'auto | responses | chat'
        required: false
        default: 'auto'

permissions:
  contents: read

concurrency:
  group: keepalive-once
  cancel-in-progress: false

jobs:
  keepalive-once:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CODEX_TOKENS: ${{ secrets.CODEX_TOKENS || secrets.ANYROUTER_TOKENS }}
      BASE_URL: ${{ github.event.inputs.base_url || 'https://anyrouter.top/v1' }}
      MODEL: ${{ github.event.inputs.model || 'gpt-6-astra' }}
      API_STYLE: ${{ github.event.inputs.api_style || 'auto' }}
      QQ_EMAIL: ${{ secrets.QQ_EMAIL }}
      QQ_SMTP_AUTH_CODE: ${{ secrets.QQ_SMTP_AUTH_CODE }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify tooling
        run: |
          jq --version
          curl --version | head -n 1

      - name: Check configuration
        run: bash scripts/preflight.sh

      - name: Run one keepalive round for all keys
        run: bash scripts/run-all.sh --once
