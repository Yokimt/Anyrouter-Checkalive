name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Syntax check
        run: |
          for file in scripts/*.sh; do
            bash -n "$file"
            echo "ok: $file"
          done

      - name: ShellCheck
        run: shellcheck -S warning scripts/*.sh

      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: Run tests
        run: bats tests/
